<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Otticando di Antonio Contino</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{width:100vw;height:100vh;position:relative;background:#fff;overflow:hidden}
#home,#testScreen{position:absolute;inset:0;background:#fff;align-items:center;justify-content:center}
#home{display:flex}#testScreen{display:none}
#homeImage,#testImage{width:100%;height:100%;object-fit:contain;display:block;background:#fff;user-select:none;-webkit-user-drag:none}
#startButton{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);border:1.5px solid #111;background:rgba(255,255,255,.92);color:#111;padding:16px 34px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:1.5px;cursor:pointer}
#homeButton{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.85);font-size:22px;cursor:pointer}
#counter{position:absolute;top:max(26px,env(safe-area-inset-top));right:25px;font-size:14px;color:rgba(0,0,0,.45);letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
<div id="home"><img id="homeImage" src="./home.png" alt="Otticando"><button id="startButton">INIZIA IL TEST</button></div>
<div id="testScreen"><img id="testImage" src="" alt="Test visivo"><button id="homeButton" aria-label="Torna alla home">×</button><div id="counter"></div></div>
</div>
<script>
const tests = [
  "./0.1.png",
  "./test-03.png",
  "./test-02.png",
  "./test-04.png",
  "./test-01.png",
  "./r_v.png"
];
let currentTest=0,touchStartX=0;
const home=document.getElementById("home"),testScreen=document.getElementById("testScreen"),testImage=document.getElementById("testImage"),counter=document.getElementById("counter"),startButton=document.getElementById("startButton"),homeButton=document.getElementById("homeButton");
function showTest(i){currentTest=i;testImage.src=tests[i];counter.textContent=(i+1)+" / "+tests.length;home.style.display="none";testScreen.style.display="flex"}
function goHome(){testScreen.style.display="none";home.style.display="flex";currentTest=0}
function nextTest(){currentTest<tests.length-1?showTest(currentTest+1):goHome()}
function previousTest(){if(currentTest>0)showTest(currentTest-1)}
startButton.addEventListener("click",()=>showTest(0));
homeButton.addEventListener("click",e=>{e.stopPropagation();goHome()});
testScreen.addEventListener("click",e=>{if(e.target===homeButton)return;e.clientX>window.innerWidth/2?nextTest():previousTest()});
testScreen.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});
testScreen.addEventListener("touchend",e=>{const d=e.changedTouches[0].screenX-touchStartX;if(Math.abs(d)<60)return;d<0?nextTest():previousTest()},{passive:true});
tests.forEach(src=>{const img=new Image();img.src=src});
</script>
</body>
</html>
