<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Otticando di Antonio Contino</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: white;
      overflow: hidden;
    }

    /* HOME */
    #home {
      position: absolute;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #homeImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #startButton {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);

      border: 1.5px solid #111;
      background: rgba(255,255,255,0.92);
      color: #111;

      padding: 16px 34px;
      border-radius: 999px;

      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.5px;

      cursor: pointer;
    }

    /* TEST */
    #testScreen {
      position: absolute;
      inset: 0;
      background: white;

      display: none;
      align-items: center;
      justify-content: center;
    }

    #testImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: white;
      user-select: none;
      -webkit-user-drag: none;
    }

    #homeButton {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: 20px;

      width: 46px;
      height: 46px;

      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.85);

      font-size: 22px;
      cursor: pointer;
    }

    #counter {
      position: absolute;
      top: max(26px, env(safe-area-inset-top));
      right: 25px;

      font-size: 14px;
      color: rgba(0,0,0,0.45);
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<div id="app">

  <!-- HOME -->
  <div id="home">
    <img id="homeImage" src="./home.png" alt="Otticando">

    <button id="startButton">
      INIZIA IL TEST
    </button>
  </div>

  <!-- TEST -->
  <div id="testScreen">
    <img id="testImage" src="" alt="Test visivo">

    <button id="homeButton" aria-label="Torna alla home">
      ×
    </button>

    <div id="counter"></div>
  </div>

</div>

<script>
  const tests = [
    "./test-01.png",
    "./test-02.png",
    "./test-03.png",
    "./test-04.png",
    "./test-05.png"
  ];

  let currentTest = 0;
  let touchStartX = 0;

  const home = document.getElementById("home");
  const testScreen = document.getElementById("testScreen");
  const testImage = document.getElementById("testImage");
  const counter = document.getElementById("counter");
  const startButton = document.getElementById("startButton");
  const homeButton = document.getElementById("homeButton");

  function showTest(index) {
    currentTest = index;

    testImage.src = tests[currentTest];

    counter.textContent =
      (currentTest + 1) + " / " + tests.length;

    home.style.display = "none";
    testScreen.style.display = "flex";
  }

  function goHome() {
    testScreen.style.display = "none";
    home.style.display = "flex";
    currentTest = 0;
  }

  function nextTest() {
    if (currentTest < tests.length - 1) {
      showTest(currentTest + 1);
    } else {
      goHome();
    }
  }

  function previousTest() {
    if (currentTest > 0) {
      showTest(currentTest - 1);
    }
  }

  startButton.addEventListener("click", function () {
    showTest(0);
  });

  homeButton.addEventListener("click", function (event) {
    event.stopPropagation();
    goHome();
  });

  /* Tap:
     metà destra = avanti
     metà sinistra = indietro
  */
  testScreen.addEventListener("click", function (event) {
    if (event.target === homeButton) return;

    if (event.clientX > window.innerWidth / 2) {
      nextTest();
    } else {
      previousTest();
    }
  });

  /* Swipe */
  testScreen.addEventListener("touchstart", function (event) {
    touchStartX = event.changedTouches[0].screenX;
  }, { passive: true });

  testScreen.addEventListener("touchend", function (event) {
    const touchEndX = event.changedTouches[0].screenX;
    const difference = touchEndX - touchStartX;

    if (Math.abs(difference) < 60) return;

    if (difference < 0) {
      nextTest();
    } else {
      previousTest();
    }
  }, { passive: true });

  /* Precarica le immagini */
  tests.forEach(function (src) {
    const img = new Image();
    img.src = src;
  });
</script>

</body>
</html>
